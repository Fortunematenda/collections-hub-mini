# Example Nginx site — put HTTPS in front of Collections Hub.
# 1) Copy to /etc/nginx/sites-available/collections-hub
# 2) Replace YOUR_DOMAIN
# 3) ln -s /etc/nginx/sites-available/collections-hub /etc/nginx/sites-enabled/
# 4) nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name YOUR_DOMAIN;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
