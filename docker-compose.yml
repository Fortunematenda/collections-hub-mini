services:
  postgres:
    image: postgres:16-alpine
    container_name: collections-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-collections_hub}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-collections_hub}
      TZ: Africa/Johannesburg
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - collections_hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-collections_hub} -d ${DB_NAME:-collections_hub}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  collections_hub_pgdata:
